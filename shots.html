<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Roonburg Shots</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #050505;
      --card: rgba(0, 0, 0, 0.64);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
      --accent: #ff3333;
      --radius-xl: 22px;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.46);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 51, 51, 0.16), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(255, 190, 80, 0.1), transparent 26%),
        linear-gradient(180deg, #080808, #030303 72%);
      color: var(--text);
    }

    body {
      overflow-x: hidden;
      position: relative;
    }

    /* =========================================
       HALLOWEEN MODE CSS - DIE VERFLUCHUNG
       ========================================= */

    @keyframes blood-pulse {
      0% { filter: brightness(1) contrast(1); }
      100% { filter: brightness(0.7) contrast(1.4); }
    }

    /* Überschreibt den Standard-Hintergrund mit etwas sehr Düsterem */
    body.halloween-mode {
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 0, 0, 0.3), transparent 35%),
        radial-gradient(circle at 82% 12%, rgba(138, 3, 3, 0.2), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(200, 0, 0, 0.15), transparent 45%),
        linear-gradient(180deg, #0a0000, #000000 80%);
      animation: blood-pulse 4s infinite alternate;
    }

    /* Blitzeffekt (Gewitter) */
    .lightning-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #fff;
      z-index: 9999;
      pointer-events: none;
    }
    
    @keyframes storm-flash {
      0%, 92%, 96%, 100% { opacity: 0; }
      93% { opacity: 0.7; }
      94% { opacity: 0; }
      97% { opacity: 0.4; }
    }

    body.halloween-mode .lightning-overlay {
      display: block;
      animation: storm-flash 7s infinite;
    }

    /* Flackernder, kaputter Text-Effekt für die H1 */
    @keyframes cursed-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
        text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000, 0 0 40px #8a0303;
        transform: scale(1) rotate(0deg);
      }
      20%, 24%, 55% {
        opacity: 0.3;
        text-shadow: none;
        transform: scale(0.98) rotate(-2deg);
      }
      85% {
        transform: scale(1.02) rotate(1deg);
      }
    }

    body.halloween-mode h1 {
      color: #ff3333;
      animation: cursed-flicker 4.5s infinite;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 0.05em;
    }

    /* Blutige Kicker-Texte */
    body.halloween-mode .kicker {
      color: #8a0303;
      text-shadow: 0 0 10px red;
    }
    body.halloween-mode h2 {
        color: #ff6600;
        text-shadow: 0 0 5px rgba(255, 102, 0, 0.5);
    }

    /* Verfluchte Drink-Reihen */
    body.halloween-mode .drink-row {
      background: rgba(15, 0, 0, 0.75);
      border-color: rgba(255, 0, 0, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    body.halloween-mode .drink-row:hover,
    body.halloween-mode .drink-row:active {
      background: rgba(40, 0, 0, 0.9);
      border-color: #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      transform: scale(1.02);
    }

    body.halloween-mode .drink-price {
      color: #ff1111;
      text-shadow: 0 0 8px rgba(255, 17, 17, 0.6);
    }

    /* =========================================
       ENDE HALLOWEEN MODE CSS
       ========================================= */

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 22px 14px 34px;
    }

    .hero {
      text-align: center;
      padding-top: 10px;
      margin-bottom: 18px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-mark {
      width: 112px;
      height: 112px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px;
      backdrop-filter: blur(10px);
    }

    .logo-mark img {
      width: 100%;
      height: auto;
      display: block;
    }

    .kicker {
      margin: 0 0 7px;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 800;
      transition: color 0.3s ease;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 13vw, 4rem);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.07em;
    }

    h2 {
        margin: 5px 0 0 0;
        font-size: 1rem;
        color: var(--muted);
    }

    .top-actions {
      margin: 18px 0 24px;
    }

    .back-btn {
      display: block;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .drink-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
      border-radius: var(--radius-xl);
      padding: 17px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .drink-name {
      margin: 0;
      min-width: 0;
      font-size: 1.08rem;
      line-height: 1.08;
      text-transform: uppercase;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .drink-price {
      flex: 0 0 auto;
      font-weight: 900;
      color: var(--accent);
      font-size: 1rem;
      white-space: nowrap;
    }

    @media (max-width: 430px) {
      .logo-mark {
        width: 104px;
        height: 104px;
      }
    }

    @media (min-width: 720px) {
      .list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <!-- Gewitter-Overlay für den Halloween Modus -->
  <div class="lightning-overlay"></div>

  <main class="page">
    <section class="hero">
      <div class="logo-wrap">
        <div class="logo-mark">
          <img
            src="https://roonburg.de/media/default/assets/config/roonburg/images/roonburg-logo.png"
            alt="Roonburg Logo"
          />
        </div>
      </div>

      <p class="kicker" id="mainKicker">2 CL</p>
      <h1 id="mainHeadline">Shots</h1>
      <h2 id="subHeadline">(an jeder Theke)</h2>
    </section>

    <div class="top-actions">
      <a class="back-btn" href="index.html">Zurück zur Auswahl</a>
    </div>

    <section class="list" id="drinkList" aria-label="Shotsliste"></section>
  </main>

  <script>
    const shots = [
      { name: "Wodka", price: "2,80 €" },
      { name: "Flimm / Xuxu", price: "2,80 €" },
      { name: "Wodka + Ahoj Brause", price: "3,20 €" },
      { name: "Sambuca", price: "2,80 €" },
      { name: "Tequila Gold/Silver", price: "2,80 €" },
      { name: "Mexikölner", price: "3,20 €" },
      { name: "Jägermeister", price: "2,80 €" },
      { name: "Kölsche Koks", price: "3,20 €" },
      { name: "Sourz", price: "2,80 €" },
      { name: "Pfeffi", price: "2,80 €" },
      { name: "Blind Shot", price: "2,50 €" },
      { name: "Dos Mas", price: "2,80 €" }
    ];

    const list = document.getElementById("drinkList");

    function renderDrinks() {
      list.innerHTML = "";

      shots.forEach(drink => {
        const row = document.createElement("article");
        row.className = "drink-row";

        row.innerHTML = `
          <h3 class="drink-name">${drink.name}</h3>
          <div class="drink-price">${drink.price}</div>
        `;

        list.appendChild(row);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Shots laden
      renderDrinks();

      // --- HALLOWEEN WEICHE ---
      const testDate = new Date(); 
      // getMonth() ist 0-basiert (9 = Oktober). getDate() ist der Tag (30 oder 31)
      const isHalloween = testDate.getMonth() === 9 && (testDate.getDate() === 30 || testDate.getDate() === 31);
      
      if (isHalloween) {
        document.body.classList.add("halloween-mode");
        
        // Texte etwas gruseliger machen
        const kickerEl = document.getElementById("mainKicker");
        const headlineEl = document.getElementById("mainHeadline");
        const subEl = document.getElementById("subHeadline");
        
        if (kickerEl) kickerEl.innerText = "Giftiges";
        if (headlineEl) headlineEl.innerHTML = "Blut-<br>Shots";
        if (subEl) subEl.innerHTML = "(Auf eigene Gefahr)";
      }
    });
  </script>
</body>
</html>
